<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тестирование чатов хелпдеска</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f5f4f1;
      --surface: #ffffff;
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.14);
      --text-primary: #111110;
      --text-secondary: #6b6a66;
      --text-tertiary: #9b9a96;
      --accent: #111110;
      --accent-text: #ffffff;
      --green: #1a7a57;
      --green-bg: #e6f4ee;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-pill: 999px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--green);
      background: var(--green-bg);
      padding: 5px 12px;
      border-radius: var(--radius-pill);
    }
    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Header */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .headline {
      font-size: 26px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }
    .subline {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Reset button */
    .reset-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: -0.01em;
      width: 100%;
      justify-content: center;
    }
    .reset-btn:hover { opacity: 0.82; }
    .reset-btn:active { transform: scale(0.98); }
    .reset-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      transition: transform 0.6s ease;
    }
    .reset-btn.loading svg { animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Card */
    .card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .card-header svg {
      width: 14px;
      height: 14px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }
    .card-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-tertiary);
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .info-row:last-child { border-bottom: none; }
    .info-row:hover { background: #fafaf9; }

    .icon-wrap {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-wrap svg {
      width: 15px;
      height: 15px;
      color: var(--text-secondary);
    }

    .info-content { flex: 1; min-width: 0; }
    .info-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 2px;
    }
    .info-value {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Skeleton */
    .skeleton {
      display: inline-block;
      height: 13px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--bg) 25%, #eae9e5 50%, var(--bg) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.6s infinite;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 480px) {
      .headline { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <span class="badge">
        <span class="badge-dot"></span>
        Helpdesk · Тестовая среда
      </span>
      <h1 class="headline">Тестирование чатов хелпдеска</h1>
      <p class="subline">Сбросьте чат, чтобы начать новый сеанс</p>
    </div>

    <button class="reset-btn" id="resetBtn" onclick="handleReset()">
      <svg id="resetIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      Сбросить чат
    </button>

    <div class="card" id="userInfo">
      <div class="card-header">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span class="card-title">Данные пользователя</span>
      </div>

      <div class="info-row">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <div class="info-content">
          <div class="info-label">ID</div>
          <div class="info-value" id="val-id"><span class="skeleton" style="width:110px"></span></div>
        </div>
      </div>

      <div class="info-row">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <div class="info-content">
          <div class="info-label">Имя</div>
          <div class="info-value" id="val-name"><span class="skeleton" style="width:85px"></span></div>
        </div>
      </div>

      <div class="info-row">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
        </div>
        <div class="info-content">
          <div class="info-label">Email</div>
          <div class="info-value" id="val-email"><span class="skeleton" style="width:150px"></span></div>
        </div>
      </div>

      <div class="info-row">
        <div class="icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
        </div>
        <div class="info-content">
          <div class="info-label">Создан</div>
          <div class="info-value" id="val-created"><span class="skeleton" style="width:100px"></span></div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
  <script src="chats.js"></script>
  <script>
    function handleReset() {
      const btn = document.getElementById('resetBtn');
      btn.classList.add('loading');
      btn.disabled = true;
      btn.style.opacity = '0.6';
      setTimeout(() => {
        btn.classList.remove('loading');
        btn.disabled = false;
        btn.style.opacity = '';
      }, 1500);
    }
  </script>
</body>
</html>
