<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование чатов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f0eb;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 50px 40px 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(180, 160, 150, 0.15);
            text-align: center;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #4a3f3a;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a09088;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .badge {
            display: inline-block;
            background: #f0ebe6;
            color: #7a6b62;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 28px;
        }

        .reset-btn {
            background: #e8e0da;
            color: #5a4f48;
            border: none;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            max-width: 280px;
        }

        .reset-btn:hover {
            background: #ddd4cc;
            transform: scale(1.01);
        }

        .reset-btn:active {
            transform: scale(0.97);
        }

        .user-info {
            margin-top: 28px;
            padding: 20px 18px;
            background: #f8f5f2;
            border-radius: 20px;
            text-align: left;
            font-size: 0.85rem;
            color: #5a4f48;
            line-height: 1.8;
        }

        .user-info strong {
            color: #8a7a70;
            font-weight: 600;
            display: inline-block;
            width: 60px;
        }

        .user-info .value {
            color: #4a3f3a;
            word-break: break-all;
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #c5b8b0;
            letter-spacing: 0.2px;
        }

        /* Адаптив */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: 24px;
            }

            h1 {
                font-size: 1.3rem;
            }

            .reset-btn {
                font-size: 0.9rem;
                padding: 10px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="icon">💬</span>
        <h1>Тестирование чатов</h1>
        <p class="subtitle">Проверьте работу виджета поддержки</p>

        <div class="badge">UpService Messenger</div>

        <button class="reset-btn" id="resetChatBtn">⟳ Сбросить сеанс</button>

        <div class="user-info" id="userInfo">
            <div><strong>ID</strong> <span class="value">—</span></div>
            <div><strong>Имя</strong> <span class="value">—</span></div>
            <div><strong>Email</strong> <span class="value">—</span></div>
        </div>

        <div class="footer-note">Данные хранятся локально</div>
    </div>

    <!-- UpService Widget -->
    <script type="text/javascript" async src="https://messenger.upservice.io/api/widget/a8e5cea9-2df6-49c8-a354-332a4ad6adce"></script>

    <script src="app.js"></script>
    <script src="chats.js"></script>

</body>
</html>
