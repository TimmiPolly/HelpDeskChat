<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестирование чатов хелпдеска</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .center {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 3rem;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            font-weight: 600;
            margin-bottom: 30px;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .user-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            text-align: left;
            max-width: 400px;
        }

        .user-info p {
            margin: 5px 0;
        }

        .user-info strong {
            color: #ffd700;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="center">
        <h1>Привет! Это страница для тестирования чатов хелпдеска</h1>
        
        <button class="reset-btn" id="resetChatBtn">
            🔄 Сбросить чат и начать новый сеанс
        </button>
        
        <div class="user-info" id="userInfo">
            <p><strong>🆔 ID:</strong> Загрузка...</p>
            <p><strong>👤 Имя:</strong> Загрузка...</p>
            <p><strong>📧 Email:</strong> Загрузка...</p>
            <p><strong>📅 Создан:</strong> Загрузка...</p>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="chats.js"></script>
</body>
</html>
